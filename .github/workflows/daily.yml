name: Daily Problem Solver

on:
  schedule:
    # Runs at 12:00 AM BDT (18:00 UTC previous day)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  solve-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull AI Model
        run: |
          ollama pull llama3.2 &
          sleep 10

      - name: Start Ollama in background
        run: |
          ollama serve &
          sleep 5

      - name: Run Daily Solver
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python main.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push
        run: |
          git add .
          DATE=$(TZ='Asia/Dhaka' date +"%Y-%m-%d")
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 daily: solve real-world problem ($DATE)

            - Auto-generated solution by AI agents
            - Problem sourced from trending discussions
            - Full-stack implementation with Next.js + Python
            - AI-powered solution using local LLM"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          pkill ollama || true
