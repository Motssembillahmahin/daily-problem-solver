name: Daily Problem Solver

on:
  schedule:
    # Runs at 12:00 AM BDT (18:00 UTC previous day)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Daily Solver
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Configure Git
        run: |
          git config user.name "Motssembillahmahin"
          git config user.email "111442017+Motssembillahmahin@users.noreply.github.com"

      - name: Commit and Push
        run: |
          git add .
          DATE=$(TZ='Asia/Dhaka' date +"%Y-%m-%d")
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 daily: solve real-world problem ($DATE)

            - Auto-generated solution by smart solver
            - Problem sourced from trending discussions
            - Working Python CLI tool"
            git push
          fi
